<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VCK IT Wing</title>
  <style>
    :root {
      --blue: #0754b8;
      --blue-dark: #06356f;
      --blue-deep: #032c60;
      --blue-light: #eaf4ff;
      --red: #d91f2d;
      --white: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d9e1ea;
      --shadow: 0 8px 30px rgba(3, 44, 96, .10);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f8fc;
      color: var(--text);
      line-height: 1.5;
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(135deg, var(--blue-deep), var(--blue));
      color: var(--white);
      padding: 18px 16px 28px;
      position: relative;
      overflow: hidden;
    }
    .header::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
      right: -80px;
      bottom: -90px;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 48px;
      position: relative;
      z-index: 2;
    }
    .wing-logo {
      width: 58px;
      height: 58px;
      object-fit: contain;
      border-radius: 10px;
      background: var(--white);
      padding: 4px;
    }
    .header-content {
      text-align: center;
      max-width: 600px;
      margin: 12px auto 0;
      position: relative;
      z-index: 2;
    }
    .leader-image {
      width: 105px;
      height: 105px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,.95);
      margin-bottom: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,.20);
    }
    .organization {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      opacity: .9;
    }
    .title {
      font-size: 28px;
      font-weight: 900;
      margin-top: 4px;
      letter-spacing: -0.5px;
    }
    .tagline {
      margin-top: 5px;
      font-size: 14px;
      opacity: .9;
    }
    .slogan {
      margin-top: 16px;
      font-size: 19px;
      font-weight: 800;
    }
    .brand-line {
      width: 52px;
      height: 4px;
      background: var(--red);
      border-radius: 10px;
      margin: 14px auto 0;
    }
    .landing-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 16px 50px;
    }
    .landing-card {
      width: 100%;
      max-width: 520px;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 20px;
      text-align: center;
    }
    .landing-card h1 {
      color: var(--blue-deep);
      font-size: 26px;
      margin-bottom: 8px;
    }
    .landing-card p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .landing-actions {
      display: grid;
      gap: 12px;
    }
    .landing-button {
      width: 100%;
      min-height: 54px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      transition: transform .15s ease, opacity .2s ease;
    }
    .landing-button:hover { transform: translateY(-1px); }
    .landing-button.primary {
      background: var(--blue);
      color: var(--white);
    }
    .landing-button.primary:hover { background: var(--blue-dark); }
    .landing-button.secondary {
      background: var(--blue-light);
      color: var(--blue-dark);
      border: 1px solid #cfe1f7;
    }
    .landing-button.admin {
      background: #f8fafc;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .site-footer {
      background: #032c60;
      color: var(--white);
      text-align: center;
      padding: 18px 16px 20px;
      font-size: 13px;
      letter-spacing: 0.4px;
    }
    .site-footer strong {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header-top">
        <img src="images/vck-it-wing-logo.jpeg" alt="VCK IT Wing" class="wing-logo" />
      </div>
      <div class="header-content">
        <img src="images/thol-thirumavalavan.jpg" alt="Leader" class="leader-image" />
        <div class="organization">VCK IT WING</div>
        <h1 class="title">Volunteer Registration</h1>
        <p class="tagline">Join the movement with your skills, creativity, and energy.</p>
        <p class="slogan">Technology for public service</p>
        <div class="brand-line"></div>
      </div>
    </header>

    <main class="landing-screen">
      <div class="landing-card">
        <h1>Choose a section</h1>
        <p>Apply for a meeting pass, check a pass, or scan attendance.</p>
        <div class="landing-actions">
          <a href="apply_meeting_pass.html" class="landing-button primary">Apply Meeting Pass</a>
          <a href="get_meeting_pass.html" class="landing-button secondary">Get Meeting Pass</a>
          <a href="scan_the_pass.html" class="landing-button admin">Scan The PASS</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <strong>VCK IT WING</strong>
      Technology for public service
    </footer>
  </div>
</body>
</html>
